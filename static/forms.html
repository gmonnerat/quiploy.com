<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Formulários</title>
</head>
<body>
  <!--
    Static copy of every Netlify Form on this site, kept so Netlify's
    build-time form detection always registers them even though the real
    forms are rendered by Hugo templates. Not linked from anywhere and
    marked noindex. Keep the field set in sync with layouts/partials/contato.html.
  -->
  <form name="contato" method="POST" action="/obrigado/" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contato">
    <input name="bot-field">
    <input type="text" name="nome">
    <input type="email" name="email">
    <input type="text" name="assunto">
    <textarea name="mensagem"></textarea>
  </form>
</body>
</html>
